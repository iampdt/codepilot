Port 3128
Listen 0.0.0.0
Timeout 120
MaxClients 50
LogLevel Connect

# Deny by default; only hosts matching a line in the allowlist are forwarded.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs No

# HTTPS only, and only to port 443.
ConnectPort 443
DisableViaHeader Yes
