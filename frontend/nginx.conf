server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    # The event stream must reach the browser as it is written.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
